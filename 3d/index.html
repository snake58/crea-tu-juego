  /* HUD */
  #hud { position:fixed; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center;

  .pill { background:rgba(10,4,24,.62); border:1px solid rgba(255,180,80,.35); color:#ffe9c9;

  #hint { position:fixed; bottom:calc(18px + env(safe-area-inset-bottom)); left:0; right:0; text-align:center;

  /* Mensaje central */
  #msg { position:fixed; top:38%; left:0; right:0; text-align:center; z-index:30; pointer-events:none;

    text-shadow:0 0 18px rgba(255,120,20,.9),0 3px 10px rgba(0,0,0,.7); opacity:0; transition:opacity .35s; }
  #msg.on { opacity:1; }
  /* Intro cinematográfica */
  #intro { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; justify-content:center; align-items:center;
    background:radial-gradient(ellipse at center, rgba(20,6,30,.25) 0%, rgba(10,3,18,.78) 100%);
    transition:opacity .8s; }
  #intro.off { opacity:0; pointer-events:none; }
  .bar { position:absolute; left:0; right:0; height:11vh; background:#000; z-index:51; transition:transform 1.1s cubic-bezier(.7,0,.3,1); }
  #barT { top:0; } #barB { bottom:0; }
  #intro.off #barT { transform:translateY(-101%); } #intro.off #barB { transform:translateY(101%); }
  #introTitle { font-size:clamp(30px,8vw,64px); font-weight:900; color:#ffd98a; text-align:center; padding:0 20px;

  #introSub { margin-top:14px; font-size:clamp(14px,3.6vw,22px); color:#ffb46a; font-weight:600; letter-spacing:2px;
    animation:titleIn 1.2s .25s cubic-bezier(.2,1.4,.4,1) both; }
  @keyframes titleIn { from { opacity:0; transform:scale(.7) translateY(26px); } to { opacity:1; transform:none; } }
  #tapStart { margin-top:34px; background:linear-gradient(180deg,#ff9a3c,#f0671a); border:none; color:#fff;
    font-size:19px; font-weight:800; padding:15px 44px; border-radius:999px; cursor:pointer;
    box-shadow:0 6px 26px rgba(255,120,20,.55), inset 0 1px 0 rgba(255,255,255,.4);
    animation:titleIn 1.2s .5s cubic-bezier(.2,1.4,.4,1) both; }
  #tapStart:active { transform:scale(.95); }
  /* Final */
  #end { position:fixed; inset:0; z-index:60; display:none; flex-direction:column; justify-content:center; align-items:center;

  #end.on { display:flex; }
  #endTitle { font-size:clamp(28px,7vw,54px); font-weight:900; color:#ffd98a;
    text-shadow:0 0 22px rgba(255,140,30,.9); margin-bottom:8px; }
  #endScore { font-size:clamp(20px,5vw,34px); color:#fff; font-weight:700; margin-bottom:26px; }
  .btnRow { display:flex; gap:14px; }
  .bigBtn { background:linear-gradient(180deg,#ff9a3c,#f0671a); border:none; color:#fff; font-size:17px; font-weight:800;

<script type="module">
import * as THREE from 'three';

/* ================= RENDERER / ESCENA ================= */
const canvas = document.getElementById('c3d');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x2a1040, 0.028);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 400);
camera.position.set(0, 1.7, 13.8);

function resize(){
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', resize); resize();

/* Resolución dinámica: baja píxeles si los FPS caen, los sube si sobra */
let pixelSteps = [Math.min(devicePixelRatio||1, 2), 1.5, 1.25, 1.0];
let pStep = 0, fpsAcc = 0, fpsN = 0, fpsTimer = 0;
renderer.setPixelRatio(pixelSteps[0]);
function autoQuality(dt){
  fpsAcc += dt; fpsN++; fpsTimer += dt;
  if (fpsTimer >= 2){
    const avg = fpsN / fpsAcc;
    if (avg < 42 && pStep < pixelSteps.length-1){ pStep++; renderer.setPixelRatio(pixelSteps[pStep]); }
    else if (avg > 57 && pStep > 0){ pStep--; renderer.setPixelRatio(pixelSteps[pStep]); }
    fpsAcc = 0; fpsN = 0; fpsTimer = 0;
  }
}

/* ================= LUCES ================= */
const sunLight = new THREE.DirectionalLight(0xffb066, 2.6);
sunLight.position.set(-8, 9, 6);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(1024, 1024);
sunLight.shadow.camera.left = -9; sunLight.shadow.camera.right = 9;
sunLight.shadow.camera.top = 9; sunLight.shadow.camera.bottom = -9;
sunLight.shadow.camera.far = 40; sunLight.shadow.bias = -0.002;
scene.add(sunLight);
scene.add(new THREE.HemisphereLight(0x8a5cff, 0x3a0f2e, 0.85)); // cielo violeta / suelo lava
const rim = new THREE.DirectionalLight(0x66aaff, 1.1); // contraluz fría
rim.position.set(6, 3, -8); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffd9b0, 0.55); // relleno cálido desde la cámara
fill.position.set(0, 2.5, 12); scene.add(fill);
const fireLight = new THREE.PointLight(0xff7a1a, 0, 14, 1.8); // fogonazo del fuego
scene.add(fireLight);

/* ================= CIELO / MUNDO ================= */
function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
// Domo del cielo: degradado atardecer épico
const skyTex = canvasTex(16, 256, (g,w,h)=>{
  const gr = g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'#12082e'); gr.addColorStop(0.42,'#4a1a5e');
  gr.addColorStop(0.62,'#b83a4a'); gr.addColorStop(0.74,'#ff7a2e'); gr.addColorStop(0.82,'#ffc46a');
  gr.addColorStop(0.9,'#7a2a3a'); gr.addColorStop(1,'#1a0a20');
  g.fillStyle = gr; g.fillRect(0,0,w,h);
});
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(180, 24, 16),
  new THREE.MeshBasicMaterial({ map:skyTex, side:THREE.BackSide, fog:false, depthWrite:false })
);
scene.add(sky);
// Sol
const sunTex = canvasTex(256, 256, (g)=>{
  const gr = g.createRadialGradient(128,128,8,128,128,128);
  gr.addColorStop(0,'rgba(255,246,220,1)'); gr.addColorStop(0.25,'rgba(255,214,140,1)');
  gr.addColorStop(0.55,'rgba(255,150,60,0.55)'); gr.addColorStop(1,'rgba(255,120,40,0)');
  g.fillStyle = gr; g.fillRect(0,0,256,256);
});
const sun = new THREE.Sprite(new THREE.SpriteMaterial({ map:sunTex, fog:false, depthWrite:false, transparent:true }));
sun.scale.set(46,46,1); sun.position.set(-52, 16, -120); scene.add(sun);
// Mar de lava lejano
const lavaTex = canvasTex(512, 512, (g,w,h)=>{
  g.fillStyle = '#20060a'; g.fillRect(0,0,w,h);
  for (let i=0;i<260;i++){
    const x = Math.random()*w, y = Math.random()*h, r = 4+Math.random()*22;
    const gr = g.createRadialGradient(x,y,1,x,y,r);
    const hot = Math.random()<0.3;
    gr.addColorStop(0, hot?'rgba(255,220,120,0.95)':'rgba(255,110,30,0.8)');
    gr.addColorStop(1,'rgba(120,20,10,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
});
lavaTex.wrapS = lavaTex.wrapT = THREE.RepeatWrapping; lavaTex.repeat.set(3,3);
const lava = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 160),
  new THREE.MeshStandardMaterial({ map:lavaTex, emissive:0xff5a1a, emissiveMap:lavaTex, emissiveIntensity:1.4, roughness:0.9 })
);
lava.rotation.x = -Math.PI/2; lava.position.set(0, -13, -40); scene.add(lava);
// Montañas: 2 cordilleras low-poly con flat shading
function ridge(count, z, yBase, col1, col2, spread){
  const grp = new THREE.Group();
  for (let i=0;i<count;i++){
    const h = 6 + Math.random()*14, r = 5 + Math.random()*9;
    const m = new THREE.Mesh(
      new THREE.ConeGeometry(r, h, 5 + (Math.random()*3|0)),
      new THREE.MeshStandardMaterial({ color: Math.random()<0.5?col1:col2, flatShading:true, roughness:1 })
    );
    m.position.set((Math.random()-0.5)*spread, yBase + h/2 - Math.random()*3, z + (Math.random()-0.5)*14);
    m.rotation.y = Math.random()*Math.PI;
    grp.add(m);
  }
  scene.add(grp); return grp;
}
ridge(16, -70, -13, 0x3a1a4e, 0x2c1240, 220);
ridge(11, -38, -13, 0x55204a, 0x431a44, 150);
// Nubes: sprites suaves a la deriva
const cloudTex = canvasTex(256, 128, (g)=>{
  for (let i=0;i<14;i++){
    const x = 40+Math.random()*176, y = 45+Math.random()*40, r = 18+Math.random()*30;
    const gr = g.createRadialGradient(x,y,2,x,y,r);
    gr.addColorStop(0,'rgba(255,200,180,0.5)'); gr.addColorStop(1,'rgba(255,160,140,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
});
const clouds = [];
for (let i=0;i<12;i++){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:cloudTex, transparent:true, opacity:0.5+Math.random()*0.4, depthWrite:false }));
  const sc = 8+Math.random()*14; s.scale.set(sc, sc*0.45, 1);
  s.position.set((Math.random()-0.5)*120, 2+Math.random()*14, -25-Math.random()*60);
  s.userData.v = 0.15+Math.random()*0.35;
  clouds.push(s); scene.add(s);
}
// Brasas flotantes (partículas ambientales)
const emberTex = canvasTex(64, 64, (g)=>{
  const gr = g.createRadialGradient(32,32,2,32,32,30);
  gr.addColorStop(0,'rgba(255,200,120,1)'); gr.addColorStop(0.5,'rgba(255,120,40,0.7)'); gr.addColorStop(1,'rgba(255,80,20,0)');
  g.fillStyle = gr; g.fillRect(0,0,64,64);
});
const EMBERS = 90;
const emberGeo = new THREE.BufferGeometry();
const emberPos = new Float32Array(EMBERS*3), emberVel = new Float32Array(EMBERS);
for (let i=0;i<EMBERS;i++){
  emberPos[i*3] = (Math.random()-0.5)*36; emberPos[i*3+1] = -8+Math.random()*20; emberPos[i*3+2] = -6-Math.random()*18;
  emberVel[i] = 0.4+Math.random()*1.1;
}
emberGeo.setAttribute('position', new THREE.BufferAttribute(emberPos, 3));
const embers = new THREE.Points(emberGeo, new THREE.PointsMaterial({
  map:emberTex, size:0.55, transparent:true, depthWrite:false,
  blending:THREE.AdditiveBlending, color:0xffa040
}));
scene.add(embers);

/* ================= DRAGÓN 3D ================= */
const dragon = new THREE.Group();
const bodyMat  = new THREE.MeshStandardMaterial({ color:0xc23a1e, roughness:0.55, metalness:0.12, flatShading:true });
const bellyMat = new THREE.MeshStandardMaterial({ color:0xffb066, roughness:0.6, metalness:0.05, flatShading:true });
const wingMat  = new THREE.MeshStandardMaterial({ color:0x9c2b1e, roughness:0.7, metalness:0.08, flatShading:true, side:THREE.DoubleSide, emissive:0x521208, emissiveIntensity:0.6 });
const hornMat  = new THREE.MeshStandardMaterial({ color:0xf3e2b8, roughness:0.4, metalness:0.25, flatShading:true });
const darkMat  = new THREE.MeshStandardMaterial({ color:0x2a0f0a, roughness:0.8, flatShading:true });

function part(geo, mat, x=0, y=0, z=0){
  const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true; dragon.add(m); return m;
}
// Cuerpo y panza
const bodyMesh = part(new THREE.SphereGeometry(1, 20, 14), bodyMat);
bodyMesh.scale.set(1.5, 1.0, 0.92);
const bellyMesh = part(new THREE.SphereGeometry(1, 16, 12), bellyMat, 0.12, -0.38, 0);
bellyMesh.scale.set(1.08, 0.62, 0.66);
// Cuello (3 segmentos curvando hacia arriba)
part(new THREE.SphereGeometry(0.56, 14, 10), bodyMat, 0.95, 0.32, 0);
part(new THREE.SphereGeometry(0.48, 14, 10), bodyMat, 1.38, 0.72, 0);
part(new THREE.SphereGeometry(0.40, 14, 10), bodyMat, 1.72, 1.10, 0);
// Cabeza
const head = new THREE.Group(); head.position.set(2.02, 1.48, 0); dragon.add(head);
function hpart(geo, mat, x=0, y=0, z=0){
  const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z);
  m.castShadow = true; m.receiveShadow = true; head.add(m); return m;
}
const skull = hpart(new THREE.SphereGeometry(0.45, 16, 12), bodyMat); skull.scale.set(1.15, 1, 0.92);
hpart(new THREE.BoxGeometry(0.55, 0.32, 0.5), bodyMat, 0.48, -0.06, 0);          // hocico
const jaw = new THREE.Group(); jaw.position.set(0.18, -0.22, 0); head.add(jaw);   // mandíbula (se abre con fuego)
{
  const jm = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.12, 0.4), bellyMat);
  jm.position.set(0.28, -0.06, 0); jm.castShadow = true; jaw.add(jm);
}
hpart(new THREE.ConeGeometry(0.09, 0.34, 8), hornMat, -0.28, 0.42, 0.22).rotation.set(-0.7, 0, -0.5); // cuernos
hpart(new THREE.ConeGeometry(0.09, 0.34, 8), hornMat, -0.28, 0.42, -0.22).rotation.set(0.7, 0, -0.5);
for (const sz of [1,-1]){ // ojos
  hpart(new THREE.SphereGeometry(0.115, 10, 8), new THREE.MeshStandardMaterial({ color:0xfff6d8, roughness:0.25 }), 0.26, 0.16, 0.30*sz);
  hpart(new THREE.SphereGeometry(0.055, 8, 6), new THREE.MeshStandardMaterial({ color:0x140a06, roughness:0.2 }), 0.345, 0.16, 0.315*sz);
}
hpart(new THREE.SphereGeometry(0.045, 6, 6), darkMat, 0.72, 0.06, 0.13);  // fosas nasales
hpart(new THREE.SphereGeometry(0.045, 6, 6), darkMat, 0.72, 0.06, -0.13);
// Púas del lomo
for (let i=0;i<4;i++){
  const spike = part(new THREE.ConeGeometry(0.11, 0.34, 6), hornMat, 0.55 - i*0.5, 0.92 - i*0.06, 0);
  spike.rotation.z = -0.35;
}
// Alas de murciélago (membrana + hueso), envergadura en ±Z, borde de ataque hacia +X
function wingGeometry(mirror){
  const s = new THREE.Shape();
  s.moveTo(0, 0.55);
  s.quadraticCurveTo(0.9, 0.78, 1.7, 0.55);
  s.quadraticCurveTo(2.2, 0.42, 2.6, 0.05);
  s.quadraticCurveTo(2.1, 0.02, 1.85, -0.28);
  s.quadraticCurveTo(1.6, -0.06, 1.35, -0.38);
  s.quadraticCurveTo(1.1, -0.16, 0.85, -0.52);
  s.quadraticCurveTo(0.6, -0.3, 0.4, -0.56);
  s.quadraticCurveTo(0.2, -0.36, 0, -0.5);
  s.closePath();
  const g = new THREE.ShapeGeometry(s, 6);
  g.rotateX(-Math.PI/2);   // acostar: envergadura en X, cuerda en Z
  g.rotateY(-Math.PI/2);   // envergadura -> +Z, borde de ataque -> +X
  if (mirror) g.scale(1, 1, -1); // ala izquierda: envergadura -> -Z
  return g;
}
function makeWing(side){ // side: +1 derecha (+Z), -1 izquierda
  const pivot = new THREE.Group(); pivot.position.set(0.1, 0.55, 0.55*side); dragon.add(pivot);
  pivot.rotation.y = -0.65*side; // barrido hacia atrás: el ala se lee bien desde la cámara lateral
  const w = new THREE.Mesh(wingGeometry(side < 0), wingMat);
  w.castShadow = true; w.receiveShadow = true;
  w.scale.set(1.15, 1.15, 1.15);
  pivot.add(w);
  return pivot;
}
const wingR = makeWing(1), wingL = makeWing(-1);
// Cola segmentada con punta de flecha
const tailSegs = [];
{
  let parent = dragon, px = -1.35;
  for (let i=0;i<5;i++){
    const g = new THREE.Group(); g.position.set(i===0 ? px : -0.55, i===0 ? 0.1 : 0, 0);
    parent.add(g);
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.30 - i*0.05, 0.24 - i*0.05, 0.6, 8), bodyMat);
    seg.rotation.z = Math.PI/2; seg.castShadow = true; g.add(seg);
    tailSegs.push(g); parent = g;
  }
  const tip = new THREE.Mesh(new THREE.ConeGeometry(0.26, 0.55, 4), hornMat);
  tip.rotation.z = Math.PI/2; tip.scale.z = 0.45; tip.position.set(-0.5, 0, 0);
  tip.castShadow = true; parent.add(tip);
}
// Patas recogidas
for (const [lx, lz] of [[0.55, 0.42],[0.55, -0.42],[-0.55, 0.42],[-0.55, -0.42]]){
  const leg = part(new THREE.CylinderGeometry(0.13, 0.10, 0.5, 8), bodyMat, lx, -0.8, lz);
  leg.rotation.x = lz > 0 ? 0.5 : -0.5;
  part(new THREE.SphereGeometry(0.14, 8, 6), darkMat, lx, -1.0, lz*1.25);
}
// Punto de origen del fuego (punta del hocico)
const snoutTip = new THREE.Object3D(); snoutTip.position.set(0.78, -0.08, 0); head.add(snoutTip);
dragon.position.set(0, 1.1, 0);
dragon.rotation.y = -0.22; // vista 3/4 desde el inicio
scene.add(dragon);

/* ================= PARTÍCULAS ================= */
class PSys {
  constructor(n, size, c1, c2, opts={}){
    this.n = n; this.c1 = new THREE.Color(c1); this.c2 = new THREE.Color(c2);
    this.grav = opts.grav || 0; this.drag = opts.drag || 0;
    this.pos = new Float32Array(n*3); this.col = new Float32Array(n*3);
    this.vel = new Float32Array(n*3); this.life = new Float32Array(n); this.max = new Float32Array(n);
    for (let i=0;i<n;i++){ this.pos[i*3+1] = -999; }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(this.pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(this.col, 3));
    this.points = new THREE.Points(g, new THREE.PointsMaterial({
      size, vertexColors:true, map:emberTex, transparent:true, depthWrite:false,
      blending: opts.additive === false ? THREE.NormalBlending : THREE.AdditiveBlending,
      opacity: opts.opacity || 1
    }));
    this.points.frustumCulled = false;
    this.cursor = 0;
    scene.add(this.points);
  }
  spawn(p, v, life){
    const i = this.cursor; this.cursor = (this.cursor+1) % this.n;
    this.pos[i*3]=p.x; this.pos[i*3+1]=p.y; this.pos[i*3+2]=p.z;
    this.vel[i*3]=v.x; this.vel[i*3+1]=v.y; this.vel[i*3+2]=v.z;
    this.life[i]=life; this.max[i]=life;
  }
  update(dt){
    for (let i=0;i<this.n;i++){
      if (this.life[i] <= 0) continue;
      this.life[i] -= dt;
      if (this.life[i] <= 0){ this.pos[i*3+1] = -999; continue; }
      const d = 1 - this.drag*dt;
      this.vel[i*3]*=d; this.vel[i*3+2]*=d;
      this.vel[i*3+1] = this.vel[i*3+1]*d - this.grav*dt;
      this.pos[i*3]+=this.vel[i*3]*dt; this.pos[i*3+1]+=this.vel[i*3+1]*dt; this.pos[i*3+2]+=this.vel[i*3+2]*dt;
      const f = this.life[i]/this.max[i];
      const r = this.c1.r + (this.c2.r-this.c1.r)*(1-f);
      const g = this.c1.g + (this.c2.g-this.c1.g)*(1-f);
      const b = this.c1.b + (this.c2.b-this.c1.b)*(1-f);
      this.col[i*3]=r*f; this.col[i*3+1]=g*f; this.col[i*3+2]=b*f;
    }
    this.points.geometry.attributes.position.needsUpdate = true;
    this.points.geometry.attributes.color.needsUpdate = true;
  }
}
const fireP  = new PSys(170, 0.75, 0xffe28a, 0xff4400, { grav:-2.2, drag:1.2 });
const boomP  = new PSys(110, 0.9,  0xfff2c8, 0xcc2200, { grav:5, drag:0.8 });
const sparkP = new PSys(80, 0.5,   0xd8fbff, 0xffc040, { drag:1.5 });
const smokeP = new PSys(50, 1.7,   0x555055, 0x222022, { grav:-1.5, drag:0.6, additive:false, opacity:0.4 });

/* ================= OBJETOS 3D ================= */
const goldMat = new THREE.MeshStandardMaterial({ color:0xd8a020, roughness:0.35, metalness:0.85, flatShading:true });
const goldDark = new THREE.MeshStandardMaterial({ color:0x8a5c10, roughness:0.5, metalness:0.7, flatShading:true });
function makeChest(){
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.6, 0.65), goldMat);
  const lid = new THREE.Mesh(new THREE.BoxGeometry(0.95, 0.28, 0.65), goldDark); lid.position.y = 0.42;
  const lock = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.24, 0.1), goldMat); lock.position.set(0, 0.25, 0.34);
  g.add(b, lid, lock);
  g.traverse(m => { if (m.isMesh){ m.castShadow = true; } });
  g.userData = { type:'chest', vy:0, spin:1.2 };
  return g;
}
function makeGem(){
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.OctahedronGeometry(0.45),
    new THREE.MeshStandardMaterial({ color:0x35e0ff, emissive:0x1899bb, emissiveIntensity:1.4, roughness:0.15, metalness:0.3, flatShading:true }));
  m.castShadow = true; g.add(m);
  g.userData = { type:'gem', vy:0, spin:2.2 };
  return g;
}
function makeBomb(){
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.SphereGeometry(0.42, 14, 10),
    new THREE.MeshStandardMaterial({ color:0x1c1c24, roughness:0.45, metalness:0.65, flatShading:true }));
  m.castShadow = true; g.add(m);
  const fuse = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.3, 6), goldDark);
  fuse.position.y = 0.5; g.add(fuse);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:emberTex, color:0xffcc44, blending:THREE.AdditiveBlending, depthWrite:false }));
  s.scale.set(0.5, 0.5, 1); s.position.y = 0.68; g.add(s);
  g.userData = { type:'bomb', vy:0, spin:0.8, spark:s };
  return g;
}
function makeRock(){
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.55),
    new THREE.MeshStandardMaterial({ color:0x4a4a52, roughness:0.95, flatShading:true }));
  m.castShadow = true; g.add(m);
  g.userData = { type:'rock', vy:0, spin:0.6, burned:false, mesh:m };
  return g;
}
const objects = [];
let spawnT = 0;
function spawnObject(elapsed){
  const r = Math.random();
  const o = r < 0.34 ? makeChest() : r < 0.52 ? makeGem() : r < 0.72 ? makeBomb() : makeRock();
  o.position.set((Math.random()-0.5)*5.2, 8.5, (Math.random()-0.5)*0.8);
  o.userData.vy = -(2.1 + Math.random()*1.6 + Math.min(elapsed*0.02, 1.6));
  o.rotation.y = Math.random()*Math.PI*2;
  objects.push(o); scene.add(o);
}

/* ================= AUDIO (sintetizado, sin archivos) ================= */
let AC = null;
function audio(){ if (!AC){ AC = new (window.AudioContext||window.webkitAudioContext)(); } return AC; }
function noiseBuf(ac, dur){
  const b = ac.createBuffer(1, ac.sampleRate*dur, ac.sampleRate);
  const d = b.getChannelData(0);
  for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
  return b;
}
function sfxFire(){
  try{
    const ac = audio(), t = ac.currentTime;
    const src = ac.createBufferSource(); src.buffer = noiseBuf(ac, 1.1);
    const f = ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value = 900; f.Q.value = 0.7;
    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.5, t+0.08);
    g.gain.exponentialRampToValueAtTime(0.0001, t+1.0);
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t); src.stop(t+1.1);
  }catch(e){}
}
function sfxBlip(freq){
  try{
    const ac = audio(), t = ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type='sine'; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq*1.6, t+0.12);
    g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+0.25);
  }catch(e){}
}
function sfxBoom(){
  try{
    const ac = audio(), t = ac.currentTime;
    const src = ac.createBufferSource(); src.buffer = noiseBuf(ac, 0.7);
    const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.setValueAtTime(900, t);
    f.frequency.exponentialRampToValueAtTime(90, t+0.6);
    const g = ac.createGain();
    g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.0001, t+0.7);
    src.connect(f); f.connect(g); g.connect(ac.destination); src.start(t); src.stop(t+0.7);
  }catch(e){}
}

/* ================= ESTADO / CONTROLES ================= */
const S = { playing:false, over:false, score:0, lives:3, time:90, elapsed:0,
            firing:0, invuln:0, targetX:0, targetY:1.1, vx:0 };
const el = id => document.getElementById(id);
const hudScore = el('pScore'), hudTime = el('pTime'), hudLives = el('pLives'),
      msgEl = el('msg'), hintEl = el('hint');
let msgTO = null;
function showMsg(t, ms=1300){
  msgEl.textContent = t; msgEl.classList.add('on');
  clearTimeout(msgTO); msgTO = setTimeout(()=>msgEl.classList.remove('on'), ms);
}
function updateHUD(){
  hudScore.textContent = '🔥 ' + S.score;
  hudTime.textContent = '⏱ ' + Math.ceil(S.time);
  hudLives.textContent = '❤️'.repeat(Math.max(S.lives,0)) + '🖤'.repeat(Math.max(3-S.lives,0));
}
// Arrastre = mover · toque corto = fuego
let pDown = null;
canvas.addEventListener('pointerdown', e => {
  audio(); // desbloquea audio en iOS
  pDown = { x:e.clientX, y:e.clientY, t:performance.now(), moved:false };
});
canvas.addEventListener('pointermove', e => {
  if (!pDown || !S.playing || S.over) return;
  const dx = e.clientX - pDown.x, dy = e.clientY - pDown.y;
  if (Math.hypot(dx,dy) > 14) pDown.moved = true;
  if (pDown.moved){
    S.targetX = THREE.MathUtils.clamp((e.clientX/innerWidth - 0.5) * 10, -4.2, 4.2);
    S.targetY = THREE.MathUtils.clamp(3.4 - (e.clientY/innerHeight) * 4.6, -0.6, 3.2);
  }
});
addEventListener('pointerup', e => {
  if (!pDown) return;
  const dt = performance.now() - pDown.t;
  if (!pDown.moved && dt < 300 && S.playing && !S.over) breatheFire();
  pDown = null;
});
const _sv = new THREE.Vector3(), _fv = new THREE.Vector3();
function breatheFire(){
  if (S.firing > 0.3) return;
  S.firing = 1.1; sfxFire(); showMsg('🔥 ¡FUEGO!', 700);
}
function fireOrigin(){
  snoutTip.getWorldPosition(_sv); return _sv;
}
function updateFire(dt){
  if (S.firing <= 0){ fireLight.intensity *= 0.85; jaw.rotation.z *= 0.9; return; }
  S.firing -= dt;
  jaw.rotation.z = Math.min(jaw.rotation.z + dt*6, 0.55); // abre la mandíbula
  const o = fireOrigin();
  fireLight.position.copy(o); fireLight.intensity = 2.5 + Math.random()*1.5;
  for (let i=0;i<7;i++){
    _fv.set(4.5+Math.random()*3.5, 1.2+Math.random()*2.4 - 1.2, (Math.random()-0.5)*1.6);
    fireP.spawn({ x:o.x+(Math.random()-0.5)*0.3, y:o.y+(Math.random()-0.5)*0.3, z:o.z+(Math.random()-0.5)*0.3 },
                { x:_fv.x, y:_fv.y, z:_fv.z }, 0.45+Math.random()*0.45);
  }
  // Quemar rocas dentro del cono
  for (const ob of objects){
    const u = ob.userData;
    if (u.type !== 'rock' || u.burned) continue;
    const dx = ob.position.x - o.x, dy = ob.position.y - o.y;
    const dist = Math.hypot(dx, dy);
    if (dist < 4.2 && dx > -0.5){
      u.burned = true;
      u.mesh.material.emissive = new THREE.Color(0xff5a10);
      u.mesh.material.emissiveIntensity = 1.6;
      u.vy = -7;
      S.score += 15; updateHUD();
      for (let k=0;k<10;k++)
        smokeP.spawn(ob.position, { x:(Math.random()-0.5)*2, y:2+Math.random()*2, z:(Math.random()-0.5)*2 }, 1+Math.random());
      showMsg('+15 🔥', 700); sfxBlip(520);
    }
  }
}

/* ================= COLISIONES ================= */
function burst(p, sys, n, spd, life){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, s = spd*(0.4+Math.random());
    sys.spawn(p, { x:Math.cos(a)*s, y:Math.sin(a)*s + spd*0.4, z:(Math.random()-0.5)*s }, life*(0.6+Math.random()*0.7));
  }
}
function checkCollisions(){
  const dx0 = dragon.position.x, dy0 = dragon.position.y;
  for (let i=objects.length-1;i>=0;i--){
    const ob = objects[i], u = ob.userData;
    const d = Math.hypot(ob.position.x - dx0, ob.position.y - dy0);
    if (u.type === 'chest' && d < 1.35){
      S.score += 10; updateHUD(); sfxBlip(660);
      burst(ob.position, sparkP, 16, 3, 0.6); showMsg('+10 💰', 650);
      scene.remove(ob); objects.splice(i,1);
    } else if (u.type === 'gem' && d < 1.3){
      S.score += 25; updateHUD(); sfxBlip(880);
      burst(ob.position, sparkP, 22, 3.6, 0.7); showMsg('+25 💎', 650);
      scene.remove(ob); objects.splice(i,1);
    } else if (u.type === 'bomb' && d < 1.15 && S.invuln <= 0){
      S.lives--; S.invuln = 1.6; updateHUD(); sfxBoom();
      burst(ob.position, boomP, 40, 6, 1.0);
      burst(ob.position, smokeP, 12, 2.5, 1.4);
      fireLight.position.copy(ob.position); fireLight.intensity = 6;
      showMsg('💥 ¡Bomba!', 1000);
      scene.remove(ob); objects.splice(i,1);
      if (S.lives <= 0) endGame(false);
    } else if (u.type === 'rock' && d < 1.2 && !u.burned){
      burst(ob.position, sparkP, 8, 2, 0.4); // rebota sin daño
      ob.position.y = dy0 + 1.6; u.vy = Math.abs(u.vy)*0.4;
    }
    if (ob.position.y < -7){ scene.remove(ob); objects.splice(i,1); }
  }
}

/* ================= FLUJO ================= */
el('tapStart').addEventListener('click', () => {
  audio();
  el('intro').classList.add('off');
  el('hud').classList.add('on'); el('badge3d').classList.add('on');
  hintEl.classList.add('on'); setTimeout(()=>hintEl.classList.remove('on'), 5000);
  S.playing = true;
  showMsg('¡Atrapa los tesoros!', 1600);
});
el('btnAgain').addEventListener('click', () => location.reload());
el('btn2d').addEventListener('click', () => { location.href = '../'; });
function endGame(win){
  S.over = true; S.playing = false;
  el('endScore').textContent = '🔥 ' + S.score + ' puntos';
  el('endTitle').textContent = win ? '¡Increíble! 🏆' : '¡Juego terminado!';
  setTimeout(()=>el('end').classList.add('on'), 600);
  sfxBlip(win ? 990 : 330);
}

/* ================= BUCLE ================= */
const clock = new THREE.Clock();
let camX = 0;
function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;
  autoQuality(dt);

  // Dragón: aleteo + nado de cola + planeo
  const flap = Math.sin(t*9)*0.5 + 0.3;
  wingR.rotation.x = -flap; wingL.rotation.x = flap;
  for (let i=0;i<tailSegs.length;i++){
    tailSegs[i].rotation.y = Math.sin(t*3.2 - i*0.7)*0.22;
    tailSegs[i].rotation.x = Math.sin(t*2.4 - i*0.5)*0.1;
  }
  head.rotation.y = Math.sin(t*1.4)*0.1;
  head.rotation.z = Math.sin(t*2.1)*0.05;

  if (S.playing && !S.over){
    S.elapsed += dt; S.time -= dt;
    if (S.time <= 0){ S.time = 0; endGame(true); }
    // Movimiento suavizado + inclinación al girar
    const px = dragon.position.x;
    dragon.position.x += (S.targetX - px) * Math.min(1, dt*7);
    dragon.position.y += (S.targetY + Math.sin(t*2.2)*0.14 - dragon.position.y) * Math.min(1, dt*6);
    S.vx = (dragon.position.x - px) / Math.max(dt, 0.001);
    dragon.rotation.z += (THREE.MathUtils.clamp(-S.vx*0.045, -0.45, 0.45) - dragon.rotation.z) * Math.min(1, dt*8);
    dragon.rotation.y += (THREE.MathUtils.clamp(-S.vx*0.02, -0.2, 0.2) - 0.22 - dragon.rotation.y) * Math.min(1, dt*8);
    if (S.invuln > 0){ S.invuln -= dt; dragon.visible = Math.floor(t*12)%2 === 0; }
    else dragon.visible = true;
    // Spawner
    spawnT -= dt;
    if (spawnT <= 0){ spawnObject(S.elapsed); spawnT = Math.max(0.42, 0.95 - S.elapsed*0.004); }
    updateFire(dt);
    checkCollisions();
    updateHUD();
  }

  // Objetos: caída + giro
  for (const ob of objects){
    const u = ob.userData;
    ob.position.y += u.vy * dt;
    ob.rotation.y += u.spin * dt;
    if (u.type === 'bomb' && u.spark) u.spark.material.opacity = 0.6 + Math.random()*0.4;
    if (u.burned){ u.vy = Math.min(u.vy - dt*4, -9); }
  }
  // Ambiente
  const ep = embers.geometry.attributes.position.array;
  for (let i=0;i<EMBERS;i++){
    ep[i*3+1] += emberVel[i]*dt; ep[i*3] += Math.sin(t*0.8 + i)*dt*0.3;
    if (ep[i*3+1] > 12){ ep[i*3+1] = -8; ep[i*3] = (Math.random()-0.5)*36; }
  }
  embers.geometry.attributes.position.needsUpdate = true;
  for (const c of clouds){ c.position.x += c.userData.v*dt; if (c.position.x > 70) c.position.x = -70; }
  lavaTex.offset.x += dt*0.008;
  fireP.update(dt); boomP.update(dt); sparkP.update(dt); smokeP.update(dt);

  // Cámara con seguimiento suave
  camX += (dragon.position.x*0.38 - camX) * Math.min(1, dt*3);
  camera.position.set(camX, 1.7 + dragon.position.y*0.18, 13.8);
  camera.lookAt(camX*1.4, 1.1, 0);

  renderer.render(scene, camera);
}
updateHUD();
tick();
